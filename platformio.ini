; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5paperS3
boards_dir = ./boards

[env]
monitor_speed = 115200
framework = arduino
test_build_src = false  ; Include the main project source in test builds
test_framework = doctest
build_flags =
	-w
	-Wl,--gc-sections
	-Os
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=0
lib_deps =
  https://github.com/Bodmer/JPEGDecoder
  https://github.com/tzapu/WiFiManager

[env:native]
platform = native
board = m5stack-fire
test_ignore = test_device
test_build_src = false
test_framework = doctest

[env:m5paper]
platform =  espressif32@6.6.0 ; Arduino 2.0.14
build_type = debug  ; Change to "release" for release build
board = m5stack-fire
board_build.flash_mode = dio
upload_speed = 2000000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DARDUINO_M5STACK_PAPER
	${env.build_flags}
	-std=gnu++17
	-Ofast
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
build_unflags =
	-std=gnu++11
lib_deps =
  ${env.lib_deps}
  https://github.com/m5stack/M5GFX
  https://github.com/jsoeterbroek/M5EPD

[env:m5paperS3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
	  ${env.build_flags}
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1 
    -DARDUINO_USB_MODE=1
lib_deps =
    ${env.lib_deps}
    epdiy=https://github.com/vroland/epdiy.git#d84d26ebebd780c4c9d4218d76fbe2727ee42b47
    M5Unified=https://github.com/m5stack/M5Unified
    https://github.com/m5stack/M5GFX
    https://github.com/jsoeterbroek/M5EPD
